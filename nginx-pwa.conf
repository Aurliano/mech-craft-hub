# Nginx Configuration for PWA
# این فایل برای تنظیم MIME types و headers مورد نیاز PWA در nginx است

server {
    listen 80;
    server_name saydatech.ir www.saydatech.ir;
    
    # Root directory
    root /var/www/html;
    index index.html;
    
    # تنظیم MIME types
    location ~* \.(json)$ {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=31536000";
    }
    
    location ~* \.(js)$ {
        add_header Content-Type "application/javascript";
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    
    # تنظیم Service Worker
    location = /service-worker.js {
        add_header Content-Type "application/javascript";
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    
    # تنظیم manifest
    location = /manifest.json {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=31536000";
    }
    
    # تنظیم آیکون‌ها
    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000";
    }
    
    # تنظیم Security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # تنظیم CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; manifest-src 'self';";
    
    # تنظیم CORS
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    
    # تنظیم compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/manifest+json;
    
    # تنظیم cache
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # تنظیم برای SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # تنظیم برای API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
