# Custom Nginx configuration for MechCraft Hub with PWA support
# This file will be included in the main server block

# Security headers
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;

# Increase client max body size for file uploads
client_max_body_size 100M;

# PWA files (service-worker.js, manifest.json, icons, screenshots) 
# are served by Django in backend/config/urls.py with correct MIME types
# Django views handle these files properly

# Serve media files
location /media {
    alias /app/backend/media;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Serve static files
location /static {
    alias /app/staticfiles_runtime;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Prevent caching for Django admin assets and pages
location ^~ /static/admin/ {
    alias /app/staticfiles_runtime/admin/;
    add_header Cache-Control "no-store";
    expires -1;
}

location ^~ /admin/ {
    add_header Cache-Control "no-store";
}

# Serve frontend static files from dist
location /favicon.ico {
    alias /app/dist/favicon.ico;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# All other requests go to Django
# PWA files, SEO endpoints, and SPA fallback are handled by Django
