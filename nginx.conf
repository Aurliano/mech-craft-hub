# Custom Nginx configuration for MechCraft Hub with PWA support
# This file will be included in the main server block

# Security headers
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;

# Increase client max body size for file uploads
client_max_body_size 100M;

# PWA MIME types and headers
# Service Worker - Force correct MIME type and no cache
location = /service-worker.js {
    alias /app/dist/service-worker.js;
    add_header Content-Type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header Service-Worker-Allowed "/";
    expires -1;
}

# Manifest - Force correct MIME type and long cache
location = /manifest.json {
    alias /app/dist/manifest.json;
    add_header Content-Type "application/manifest+json; charset=utf-8";
    add_header Cache-Control "public, max-age=31536000";
    expires 1y;
}

# PWA Icons - Long cache
location /icons/ {
    alias /app/dist/icons/;
    add_header Cache-Control "public, max-age=31536000";
    expires 1y;
}

# PWA Screenshots - Long cache
location /screenshots/ {
    alias /app/dist/screenshots/;
    add_header Cache-Control "public, max-age=31536000";
    expires 1y;
}

# PWA Debug Scripts - No cache
location ~ ^/(pwa-debug|pwa-test|mime-test)\.js$ {
    alias /app/dist$request_uri;
    add_header Content-Type "application/javascript; charset=utf-8";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
}

# Serve media files
location /media {
    alias /app/media;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Serve static files
location /static {
    alias /app/staticfiles;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Serve frontend static files from dist
location /favicon.ico {
    alias /app/dist/favicon.ico;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /robots.txt {
    alias /app/dist/robots.txt;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Main application
location / {
    try_files /dev/null @django_app;
}

# Deny access to SQLite files
location ~ \.sqlite3$ {
    deny all;
    error_page 403 =404 /;
}

# Allow well-known directory for SSL verification
location ~ /\.well-known {
    allow all;
}

# Health check endpoint
location /health/ {
    try_files /dev/null @django_app;
}
