<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnstile Test</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <h1>Turnstile Test</h1>
    <div id="turnstile-widget"></div>
    
    <script>
        // Test with your actual site key
        const SITE_KEY = '0x4AAAAAAB2SlyjnmjItRMWI'; // Replace with your actual site key
        
        function renderTurnstile() {
            if (window.turnstile) {
                try {
                    const widgetId = window.turnstile.render('#turnstile-widget', {
                        sitekey: SITE_KEY,
                        callback: function(token) {
                            console.log('Success! Token:', token);
                            document.getElementById('result').innerHTML = '<p style="color: green;">Success! Token received: ' + token.substring(0, 20) + '...</p>';
                        },
                        'error-callback': function() {
                            console.error('Turnstile error occurred');
                            document.getElementById('result').innerHTML = '<p style="color: red;">Turnstile error occurred</p>';
                        },
                        'expired-callback': function() {
                            console.log('Turnstile token expired');
                            document.getElementById('result').innerHTML = '<p style="color: orange;">Token expired</p>';
                        },
                        'timeout-callback': function() {
                            console.log('Turnstile timeout occurred');
                            document.getElementById('result').innerHTML = '<p style="color: orange;">Timeout occurred</p>';
                        }
                    });
                    console.log('Turnstile widget rendered with ID:', widgetId);
                } catch (err) {
                    console.error('Error rendering Turnstile:', err);
                    document.getElementById('result').innerHTML = '<p style="color: red;">Error rendering Turnstile: ' + err.message + '</p>';
                }
            } else {
                console.error('Turnstile not loaded');
                document.getElementById('result').innerHTML = '<p style="color: red;">Turnstile script not loaded</p>';
            }
        }
        
        // Wait for Turnstile to load
        window.addEventListener('load', function() {
            setTimeout(renderTurnstile, 1000);
        });
    </script>
    
    <div id="result"></div>
    
    <h2>Debug Info:</h2>
    <p>Site Key: <code id="sitekey"></code></p>
    <p>Domain: <code id="domain"></code></p>
    <p>User Agent: <code id="useragent"></code></p>
    
    <script>
        document.getElementById('sitekey').textContent = SITE_KEY;
        document.getElementById('domain').textContent = window.location.hostname;
        document.getElementById('useragent').textContent = navigator.userAgent;
    </script>
</body>
</html>
